name: Feature request
description: Suggest something Fabolus could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or clinical workflow step, and what makes it hard today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working. Rough is fine.

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do now instead?
