version: 2

updates:
  # NuGet packages. Grouped so a month's updates arrive as one pull request rather than a
  # dozen. Test-only packages are grouped separately: they never ship, so they are low risk.
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "FluentAssertions"
          - "Moq"
      # The test packages are excluded here too, or this group takes them as well and its
      # pull request supersedes the test-only one (as #78 did #77).
      app-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet*"
          - "FluentAssertions"
          - "Moq"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
